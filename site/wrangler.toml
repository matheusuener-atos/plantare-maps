# Site do Plantare Maps (arquivos estáticos na Cloudflare).
# Publicar:  copie ../plantare-maps.html para public/index.html e rode  npx wrangler deploy  nesta pasta.
name = "plantare-app"
compatibility_date = "2026-09-01"

# O domínio já está na Cloudflare: o DNS é criado sozinho no deploy
routes = [
  { pattern = "plantare.matheusuener.com.br", custom_domain = true }
]

[assets]
directory = "./public"
