name = "plantare-pix"
main = "src/index.js"
compatibility_date = "2026-09-01"
# o acesso à Conta Atos é do tipo "servidor": o @atos.dev.br/entrar lê o segredo ATOS_CLIENT_SECRET de process.env
compatibility_flags = ["nodejs_compat"]

# Endereço próprio (o domínio já está na Cloudflare: o DNS é criado sozinho no deploy)
routes = [
  { pattern = "pix.plantaremaps.com.br", custom_domain = true },
  # endereço antigo: mantido enquanto houver app ou webhook apontando para ele
  { pattern = "pix.matheusuener.com.br", custom_domain = true }
]

[vars]
# Quem pode chamar o serviço (a página onde o Plantare fica publicado).
# "null" libera o app aberto como arquivo local (file://) — use só em teste.
ORIGENS = "https://plantaremaps.com.br,https://www.plantaremaps.com.br,https://plantare.matheusuener.com.br"

# Login pela Conta Atos (atos.dev.br › Workspace › Integrações). Vazio = login desligado (as rotas /conta/atos respondem 503).
# ATOS_CLIENT_ID: o client_id do acesso. ATOS_VOLTA: o endereço de retorno, exatamente como cadastrado
# (mais de um, separados por vírgula, todos cadastrados; o primeiro é o padrão).
# O acesso é do tipo "servidor": o segredo vai por  npx wrangler secret put ATOS_CLIENT_SECRET  (nesta pasta).
ATOS_CLIENT_ID = "u-tlwhzxkfv5-j5rmta"
ATOS_VOLTA = "https://plantaremaps.com.br/"
# Por quantos dias uma compra paga pode ser baixada de novo (mesmo talhão, mesmas camadas). 0 = sem limite.
REBAIXAR_DIAS = "365"
# Remetente dos e-mails de cortesia (domínio precisa estar no Email Sending da Cloudflare)
EMAIL_DE = "nao-responda@plantaremaps.com.br"
# Validade do Pix (ISO 8601)
EXPIRA = "PT30M"
# Só em teste, com o token do vendedor de teste: PAGADOR_TESTE = "APRO" (o Mercado Pago aprova o Pix de teste sozinho).

# Segredos (não vão para o arquivo):
#   npx wrangler secret put MP_ACCESS_TOKEN      ← Access Token de produção do Mercado Pago
#   npx wrangler secret put MP_WEBHOOK_SECRET    ← "Assinatura secreta" da tela de Webhooks
#   npx wrangler secret put ATOS_CLIENT_SECRET   ← o segredo do acesso na Atos
#   npx wrangler secret put ATOS_AVISOS_SEGREDO  ← o segredo dos avisos (Atos › Integrações › Avisos ao seu sistema)
#   npx wrangler secret put AVISO_EMAIL          ← seu e-mail: recebe a cópia de cada cortesia usada

# Banco: contas, sessões, compras, cupons, cadastro e talhões. Esquema em migrations/;
# aplicar com  npx wrangler d1 migrations apply plantare --remote
[[d1_databases]]
binding = "DB"
database_name = "plantare"
database_id = "fa237575-a9c7-49db-8151-83866aa4e67d"
migrations_dir = "migrations"

# Projetos dos talhões (o arquivo inteiro, comprimido): R2, bucket "plantare-projetos".
[[r2_buckets]]
binding = "PROJETOS"
bucket_name = "plantare-projetos"

# Gerar os arquivos leva de 40 ms (talhão pequeno) a ~300 ms de CPU (575 ha).
# O plano grátis do Workers corta em 10 ms: este serviço precisa do Workers Paid (limite padrão 30 s).

# Envio de e-mail (Cloudflare Email Service). Destinatário qualquer exige o plano Workers Paid;
# no plano grátis só chega em endereços verificados da conta (a cópia para AVISO_EMAIL).
[[send_email]]
name = "EMAIL"
